<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Window | Visual Weather</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-page="visual-weather">
    <header id="site-header"></header>

    <main>
      <section class="weather-content">
        <h1>Visual Weather</h1>

        <p id="location-name">Select a location to explore its weather.</p>

        <div id="weather-window">
          <!-- Weather visuals will be added here -->
        </div>

        <div id="weather-information">
          <!-- Weather statistics will be added here -->
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
