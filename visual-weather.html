<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Window | Visual Weather</title>

    <script>
      try {
        const destination = sessionStorage.getItem("weather-window-transition");
        const current =
          window.location.pathname +
          window.location.search +
          window.location.hash;
        if (destination === current) {
          document.documentElement.classList.add("transition-arriving");
        }
      } catch (error) {}
    </script>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-page="visual-weather">
    <!-- GSAP Page Transition Overlay -->
    <div id="page-transition" aria-hidden="true">
      <svg
        class="transition-svg"
        viewBox="0 0 100 140"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M0 0 Q50 20 100 0 L100 140 Q50 120 0 140 Z" />
      </svg>
    </div>
    <header id="site-header"></header>

    <main>
      <section class="weather-content">
        <h1>Visual Weather</h1>
        <p id="location-name">Select a location to explore its weather.</p>
        <div class="weather-scene">
          <div id="weather-window">
            <!-- Weather visuals and summary will go here -->
          </div>
          <div id="weather-information">
            <!-- Weather statistics will be added here -->
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
