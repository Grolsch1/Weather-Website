<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Window | Home</title>

    <link rel="stylesheet" href="css/style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body data-page="home">
    <header id="site-header"></header>

    <main>
      <section class="home-content">
        <h1>Look outside.</h1>

        <p>Explore the weather around the world.</p>

        <div class="search-container">
          <input
            type="text"
            id="location-search"
            placeholder="Search for a location..."
            aria-label="Search for a location"
            autocomplete="off"
            aria-controls="search-predictions"
            aria-expanded="false"
          />

          <button id="search-button">Search</button>
        </div>

        <div
          id="search-predictions"
          role="listbox"
          aria-label="Location suggestions"
          aria-live="polite"
        ></div>
        <p
          id="search-message"
          class="search-message"
          role="status"
          aria-live="polite"
        ></p>
      </section>

      <!-- Featured Weather -->
      <section class="featured-weather">
        <div class="featured-heading">
          <h2>Temperature Extremes</h2>
          <p>Discover the warmest and coldest weather from availble cities</p>
        </div>
        <div class="extreme-cards" id="extreme-cards">
          <p class="featured-loading">Loading featured weather...</p>
        </div>
      </section>

      <!-- Explore Cities -->
      <section class="explore-cities">
        <div class="featured-heading">
          <h2>Explore some of the World</h2>
          <p>
            Not sure what city you want to look at? Why not start with some of
            these cities?
          </p>
        </div>
        <div class="city-cards" id="city-cards"></div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
